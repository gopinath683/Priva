openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Priva Job Portal API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: profile
    description: Job seeker profile
  - name: companies
    description: Recruiter company profiles
  - name: jobs
    description: Job listings
  - name: applications
    description: Job applications
  - name: admin
    description: Admin operations
  - name: dashboard
    description: Dashboard summaries

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/register:
    post:
      operationId: registerUser
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRegistration"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Validation error

  /auth/login:
    post:
      operationId: loginUser
      tags: [auth]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginCredentials"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logoutUser
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "200":
          description: Reset email sent

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "200":
          description: Password reset successful

  # Profile
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get current user's profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found
    put:
      operationId: updateProfile
      tags: [profile]
      summary: Create or update profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"

  /profile/{userId}:
    get:
      operationId: getProfileByUserId
      tags: [profile]
      summary: Get profile by user ID (recruiter/admin)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        "404":
          description: Profile not found

  # Companies
  /companies:
    get:
      operationId: listCompanies
      tags: [companies]
      summary: List companies
      responses:
        "200":
          description: List of companies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Company"
    post:
      operationId: createCompany
      tags: [companies]
      summary: Create a company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "201":
          description: Company created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  /companies/{id}:
    get:
      operationId: getCompany
      tags: [companies]
      summary: Get company by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"
        "404":
          description: Company not found
    put:
      operationId: updateCompany
      tags: [companies]
      summary: Update company profile
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyInput"
      responses:
        "200":
          description: Updated company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Company"

  # Jobs
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List/search jobs
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: workMode
          in: query
          schema:
            type: string
            enum: [remote, hybrid, onsite]
        - name: employmentType
          in: query
          schema:
            type: string
            enum: [full-time, part-time]
        - name: experienceLevel
          in: query
          schema:
            type: string
            enum: [fresher, "1-3", "3-5", "5+"]
        - name: status
          in: query
          schema:
            type: string
            enum: [active, inactive, pending]
        - name: companyId
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: offset
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Post a new job (recruiter)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/featured:
    get:
      operationId: getFeaturedJobs
      tags: [jobs]
      summary: Get featured/top active jobs
      responses:
        "200":
          description: Featured jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

  /jobs/categories:
    get:
      operationId: getJobCategories
      tags: [jobs]
      summary: Get job count by category/work mode
      responses:
        "200":
          description: Category counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobCategory"

  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get job by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
    delete:
      operationId: deleteJob
      tags: [jobs]
      summary: Delete a job posting
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /jobs/{id}/status:
    patch:
      operationId: updateJobStatus
      tags: [jobs]
      summary: Update job status (admin approve/reject)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobStatusChange"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  # Applications
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List applications (job seeker sees own, recruiter sees by job)
      parameters:
        - name: jobId
          in: query
          schema:
            type: integer
        - name: candidateId
          in: query
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
    post:
      operationId: createApplication
      tags: [applications]
      summary: Apply to a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get application details
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Application details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "404":
          description: Not found

  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status (recruiter)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusChange"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"

  # Dashboard
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get platform-wide stats (admin)
      responses:
        "200":
          description: Dashboard statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  /dashboard/recruiter:
    get:
      operationId: getRecruiterDashboard
      tags: [dashboard]
      summary: Get recruiter's own dashboard stats
      responses:
        "200":
          description: Recruiter dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RecruiterDashboard"

  # Saved Jobs
  /saved-jobs:
    get:
      operationId: listSavedJobs
      tags: [jobs]
      summary: List saved jobs for the current user
      responses:
        "200":
          description: List of saved jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SavedJob"
        "401":
          description: Not authenticated
    post:
      operationId: saveJob
      tags: [jobs]
      summary: Save a job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveJobInput"
      responses:
        "201":
          description: Job saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedJob"
        "400":
          description: Already saved or invalid input
        "401":
          description: Not authenticated

  /saved-jobs/{jobId}:
    delete:
      operationId: unsaveJob
      tags: [jobs]
      summary: Remove a saved job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Unsaved
        "401":
          description: Not authenticated
        "404":
          description: Not found

  # Admin
  /admin/users:
    get:
      operationId: listUsers
      tags: [admin]
      summary: List all users (admin)
      parameters:
        - name: role
          in: query
          schema:
            type: string
            enum: [job_seeker, recruiter, admin]
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /admin/users/{id}:
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete user (admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /admin/jobs:
    get:
      operationId: listAllJobs
      tags: [admin]
      summary: List all jobs including pending (admin)
      responses:
        "200":
          description: All jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # Auth schemas
    UserRegistration:
      type: object
      required: [name, email, password, role]
      properties:
        name:
          type: string
          minLength: 1
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [job_seeker, recruiter]

    LoginCredentials:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
        password:
          type: string
          minLength: 6

    User:
      type: object
      required: [id, name, email, role, createdAt]
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        role:
          type: string
          enum: [job_seeker, recruiter, admin]
        createdAt:
          type: string
          format: date-time

    # Profile schemas
    ProfileInput:
      type: object
      properties:
        phone:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        education:
          type: ["string", "null"]
        experienceYears:
          type: ["integer", "null"]
        expectedSalary:
          type: ["integer", "null"]
        resumeUrl:
          type: ["string", "null"]

    Profile:
      type: object
      required: [id, userId]
      properties:
        id:
          type: integer
        userId:
          type: integer
        phone:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        education:
          type: ["string", "null"]
        experienceYears:
          type: ["integer", "null"]
        expectedSalary:
          type: ["integer", "null"]
        resumeUrl:
          type: ["string", "null"]
        user:
          $ref: "#/components/schemas/User"

    # Company schemas
    CompanyInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        website:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        logo:
          type: ["string", "null"]

    Company:
      type: object
      required: [id, recruiterId, name, createdAt]
      properties:
        id:
          type: integer
        recruiterId:
          type: integer
        name:
          type: string
        website:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        logo:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    # Job schemas
    JobInput:
      type: object
      required: [title, description, location, employmentType, workMode]
      properties:
        title:
          type: string
          minLength: 1
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        location:
          type: string
        experienceMin:
          type: ["integer", "null"]
        experienceMax:
          type: ["integer", "null"]
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        workMode:
          type: string
          enum: [remote, hybrid, onsite]
        employmentType:
          type: string
          enum: [full-time, part-time]
        companyId:
          type: ["integer", "null"]

    JobUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        location:
          type: string
        experienceMin:
          type: ["integer", "null"]
        experienceMax:
          type: ["integer", "null"]
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        workMode:
          type: string
          enum: [remote, hybrid, onsite]
        employmentType:
          type: string
          enum: [full-time, part-time]

    JobStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [active, inactive, pending]

    Job:
      type: object
      required: [id, title, description, location, employmentType, workMode, status, postedAt]
      properties:
        id:
          type: integer
        companyId:
          type: ["integer", "null"]
        recruiterId:
          type: integer
        title:
          type: string
        description:
          type: string
        skills:
          type: array
          items:
            type: string
        location:
          type: string
        experienceMin:
          type: ["integer", "null"]
        experienceMax:
          type: ["integer", "null"]
        salaryMin:
          type: ["integer", "null"]
        salaryMax:
          type: ["integer", "null"]
        workMode:
          type: string
          enum: [remote, hybrid, onsite]
        employmentType:
          type: string
          enum: [full-time, part-time]
        status:
          type: string
          enum: [active, inactive, pending]
        postedAt:
          type: string
          format: date-time
        company:
          $ref: "#/components/schemas/Company"

    JobListResponse:
      type: object
      required: [jobs, total]
      properties:
        jobs:
          type: array
          items:
            $ref: "#/components/schemas/Job"
        total:
          type: integer

    JobCategory:
      type: object
      required: [label, count]
      properties:
        label:
          type: string
        count:
          type: integer

    # Application schemas
    ApplicationInput:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: integer

    ApplicationStatusChange:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [applied, viewed, shortlisted, rejected, interview_scheduled, hired]

    Application:
      type: object
      required: [id, jobId, candidateId, status, appliedAt]
      properties:
        id:
          type: integer
        jobId:
          type: integer
        candidateId:
          type: integer
        status:
          type: string
          enum: [applied, viewed, shortlisted, rejected, interview_scheduled, hired]
        appliedAt:
          type: string
          format: date-time
        job:
          $ref: "#/components/schemas/Job"
        candidate:
          $ref: "#/components/schemas/User"

    # Dashboard schemas
    DashboardStats:
      type: object
      required: [totalUsers, totalRecruiters, totalJobs, activeJobs, pendingJobs, totalApplications]
      properties:
        totalUsers:
          type: integer
        totalRecruiters:
          type: integer
        totalJobs:
          type: integer
        activeJobs:
          type: integer
        pendingJobs:
          type: integer
        totalApplications:
          type: integer

    RecruiterDashboard:
      type: object
      required: [totalJobsPosted, activeJobs, totalApplicants, recentApplications]
      properties:
        totalJobsPosted:
          type: integer
        activeJobs:
          type: integer
        totalApplicants:
          type: integer
        recentApplications:
          type: array
          items:
            $ref: "#/components/schemas/Application"
        applicationStatusBreakdown:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationStatusCount"

    SaveJobInput:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: integer

    SavedJob:
      type: object
      required: [id, userId, jobId, savedAt]
      properties:
        id:
          type: integer
        userId:
          type: integer
        jobId:
          type: integer
        savedAt:
          type: string
          format: date-time
        job:
          $ref: "#/components/schemas/Job"

    ApplicationStatusCount:
      type: object
      required: [status, count]
      properties:
        status:
          type: string
        count:
          type: integer
